[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-emotion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "joblib==1.4.2",
    "numpy==2.2.5",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pydantic==2.11.4",
    "scikit-learn==1.6.1",
    "uvicorn==0.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]
